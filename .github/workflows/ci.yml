name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: pre-commit (ruff, formatting, import contracts, lockfile)
        run: uv run pre-commit run --all-files --show-diff-on-failure

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: make test-unit

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_FILES: -f infra/docker-compose.yml -f infra/docker-compose.test.yml
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Start stack (waits for all healthchecks, runs migrations)
        run: make up
      - run: make test-integration
      - name: Stack status and logs
        if: failure()
        run: |
          make ps
          docker compose $COMPOSE_FILES --env-file .env logs --tail 200
      - if: always()
        run: make clean

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      # No API yet; this job gains `make up` when the first e2e test lands.
      - run: make test-e2e

  eval:
    # Model evals are slow and costly: run on main, on demand, or with the
    # `run-eval` label, never on every PR push.
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'run-eval')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: make test-eval
