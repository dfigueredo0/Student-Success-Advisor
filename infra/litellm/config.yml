# LiteLLM gateway: every model call from the app goes through here.

# The app asks for a model by its alias (model_name); LiteLLM decides which
# real model answers. Swapping models later only means editing this list.
model_list:
  # Router and slot filling. qwen3:14b won the router bake-off (docs/adr/0001-router-model.md).
  # The model comes from OLLAMA_MODEL in .env (docker-compose.yml sets LOCAL_LLM_MODEL from it),
  # so a laptop that can't fit 14b runs a smaller one by changing .env only.
  - model_name: local-llm
    litellm_params:
      model: os.environ/LOCAL_LLM_MODEL
      # Inside Docker, containers reach each other by service name, not localhost.
      api_base: http://ollama:11434

  - model_name: nomic-embed-text
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: http://ollama:11434
    # An embedding model can't chat, so /health must test it with an embedding call.
    model_info:
      mode: embedding

general_settings:
  # Secrets come from environment variables, never from this file.
  master_key: os.environ/LITELLM_MASTER_KEY
  # LiteLLM's own database, for virtual keys, budgets, and spend logs.
  database_url: os.environ/LITELLM_DATABASE_URL

litellm_settings:
  # Log every request (successful or not) to Langfuse as an audit trail.
  success_callback: ["langfuse"]
  failure_callback: ["langfuse"]

guardrails:
  - guardrail_name: prompt-injection
    litellm_params:
      guardrail: injection_guard.PromptInjectionGuard
      mode: pre_call
      default_on: true

  - guardrail_name: output-check
    litellm_params:
      guardrail: output_guard.OutputGuard
      mode: [pre_call, post_call]
      default_on: true
